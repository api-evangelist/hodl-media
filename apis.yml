aid: hodl-media
name: HODL Media
description: HODL Media (hodl.mobi) is the maker of HODL Real-Time Cryptocurrency, a consumer mobile
  application for iOS and Android that tracks cryptocurrency and stock market prices in real time. The
  app aggregates pricing from 180+ global exchanges, offers customizable charting with technical
  indicators, price alerts and bracket management, portfolio tracking with exchange and wallet
  synchronization (Coinbase Pro, Binance, Ethereum wallets), aggregated news and social feeds, and
  stock market data from NYSE and NASDAQ. It is a portfolio company of 500 Global. As of this profile
  HODL Media publishes no public API, SDK, developer portal, or programmatic documentation; this repo
  is maintained as an API Evangelist network lead.
